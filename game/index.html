<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline Harbour — Spot the Difference</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b141f;
    color: #eef3f8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px 20px;
  }
  canvas {
    width: min(1200px, 98vw);
    height: auto;
    border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
    touch-action: manipulation;
    cursor: pointer;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }
  .toolbar button {
    background: #1b2f47;
    color: #eef3f8;
    border: 1px solid rgba(242, 182, 60, 0.45);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #27405e; }
  .help {
    margin-top: 10px;
    font-size: 13px;
    color: rgba(238, 243, 248, 0.55);
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="1200" height="692" aria-label="Tideline Harbour spot-the-difference game"></canvas>
<div class="toolbar">
  <button id="btn-hint" type="button">Hint (H) — 25 pts</button>
  <button id="btn-pause" type="button">Pause (P)</button>
  <button id="btn-mute" type="button">Mute (M)</button>
  <button id="btn-restart" type="button">Restart scene (R)</button>
</div>
<p class="help">Click a difference in either picture. Found: +100 points and +2 seconds. Missed: −3 seconds. Find them all before the tide comes in.</p>
<script type="module" src="src/main.js"></script>
</body>
</html>
